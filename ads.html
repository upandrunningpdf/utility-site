<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Lipstick Ad</title>

<style>

/* ================================
   PAGE
================================ */

body {
    margin: 0;
    padding: 0;
    background: white;
    font-family: Arial, sans-serif;
    text-align: center;
}


/* ================================
   TOP DIVIDER
================================ */

.divider {
    width: 90%;
    height: 2px;
    background: #222;
    margin: 15px auto;
}


/* ================================
   SMALL AD
================================ */

.ad-box {
    width: 180px;
    height: 180px;
    margin: 25px auto;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* ================================
   LIPS ICON
================================ */

.lips {
    width: 120px;
    height: 120px;
    object-fit: contain;

    animation: lipstickColors 8s infinite;
}


/* ================================
   COLOR CHANGING
================================ */

@keyframes lipstickColors {

    0% {
        filter:
        sepia(1)
        saturate(8)
        hue-rotate(320deg);
    }

    25% {
        filter:
        sepia(1)
        saturate(8)
        hue-rotate(0deg);
    }

    50% {
        filter:
        sepia(1)
        saturate(8)
        hue-rotate(30deg);
    }

    75% {
        filter:
        sepia(1)
        saturate(8)
        hue-rotate(280deg);
    }

    100% {
        filter:
        sepia(1)
        saturate(8)
        hue-rotate(320deg);
    }

}


/* ================================
   AD TEXT
================================ */

.ad-text {
    font-size: 16px;
    font-weight: bold;
    margin-top: 5px;
}


/* ================================
   MAIN PAGE LINK
================================ */

.back {
    margin: 15px;
}

.back a {
    text-decoration: none;
    font-weight: bold;
    color: #222;
}


/* ================================
   BOTTOM DIVIDER
================================ */

.divider-bottom {
    width: 90%;
    height: 2px;
    background: #222;
    margin: 15px auto;
}

</style>
</head>

<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lipstick Color Ad</title>

<style>

/* =========================================
   PAGE
========================================= */

body {
    margin: 0;
    padding: 15px;
    background: white;
    font-family: Arial, sans-serif;
    text-align: center;
}


/* =========================================
   DIVIDERS
========================================= */

.divider {
    width: 90%;
    height: 2px;
    background: #222;
    margin: 10px auto;
}


/* =========================================
   SMALL AD
========================================= */

.ad {
    width: 260px;
    height: 230px;
    margin: 15px auto;
    position: relative;
}


/* =========================================
   SVG
========================================= */

svg {
    width: 260px;
    height: 230px;
    overflow: visible;
}


/* =========================================
   LIPS
========================================= */

.lips {
    transform-origin: center;
}


/* Upper lip */

.upper-lip {
    fill: var(--lip-color);
    stroke: #5c0716;
    stroke-width: 2;
}


/* Lower lip */

.lower-lip {
    fill: var(--lip-color);
    stroke: #5c0716;
    stroke-width: 2;
}


/* Lip highlight */

.highlight {
    fill: rgba(255,255,255,.35);
}


/* =========================================
   LIPSTICK
========================================= */

.lipstick {
    transform-origin: center;
    animation: applyLipstick 6s infinite ease-in-out;
}


/* =========================================
   LIPSTICK MOVEMENT
========================================= */

@keyframes applyLipstick {

    /* Start away from lips */

    0% {
        transform:
        translate(0px, -20px)
        rotate(-25deg);
    }

    /* Move toward lower lip */

    12% {
        transform:
        translate(55px, 45px)
        rotate(-20deg);
    }

    /* Touch left side */

    22% {
        transform:
        translate(70px, 75px)
        rotate(-18deg);
    }

    /* Sweep across lower lip */

    42% {
        transform:
        translate(145px, 72px)
        rotate(-5deg);
    }

    /* Continue across */

    55% {
        transform:
        translate(190px, 68px)
        rotate(10deg);
    }

    /* Lift away */

    68% {
        transform:
        translate(215px, 25px)
        rotate(25deg);
    }

    /* Stay away */

    78% {
        transform:
        translate(215px, 25px)
        rotate(25deg);
    }

    /* Return */

    100% {
        transform:
        translate(0px, -20px)
        rotate(-25deg);
    }
}


/* =========================================
   LIP COLOR APPLICATION
========================================= */

.color-fill {
    animation: applyColor 6s infinite;
}


/* Color gradually appears */

@keyframes applyColor {

    0% {
        opacity: 0;
    }

    18% {
        opacity: 0;
    }

    30% {
        opacity: .25;
    }

    45% {
        opacity: .55;
    }

    58% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}


/* =========================================
   COLOR SWATCH
========================================= */

.swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    margin: 3px auto 5px;

    background: #d81b60;

    animation: swatchChange 24s infinite;
}


@keyframes swatchChange {

    0%, 24% {
        background: #d81b60;
    }

    25%, 49% {
        background: #e53935;
    }

    50%, 74% {
        background: #8e24aa;
    }

    75%, 100% {
        background: #f4511e;
    }
}


/* =========================================
   COLOR NAME
========================================= */

.color-name {
    font-size: 14px;
    font-weight: bold;
    animation: nameChange 24s infinite;
}


@keyframes nameChange {

    0%, 24% {
        color: #d81b60;
    }

    25%, 49% {
        color: #e53935;
    }

    50%, 74% {
        color: #8e24aa;
    }

    75%, 100% {
        color: #f4511e;
    }
}


/* =========================================
   AD MESSAGE
========================================= */

.message {
    font-size: 14px;
    font-weight: bold;
    margin-top: 3px;
}


/* =========================================
   BACK LINK
========================================= */

.back {
    margin: 10px;
}

.back a {
    color: #222;
    font-weight: bold;
    text-decoration: none;
}

.back a:hover {
    text-decoration: underline;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 500px) {

    .ad {
        transform: scale(.9);
        margin: 5px auto;
    }

}

</style>

</head>

<body>

<!-- =========================================
     TOP DIVIDER
========================================= -->

<div class="divider"></div>

<!-- =========================================

========================================= -->

<div class="ad">

<svg viewBox="0 0 260 230">
